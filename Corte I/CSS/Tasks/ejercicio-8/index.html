<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 8 - Responsive Design</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="contenedor">
        <header class="encabezado">
            <h1>Mi sitio web</h1>
        </header>
 
        <section class="contenido">
            <p>
                Este contenedor tiene un ancho fijo en pantallas grandes,
                pero se adapta al 100% del ancho disponible en pantallas
                de dispositivos móviles gracias a una media query.
            </p>
            <p>
                Reduce el tamaño de la ventana del navegador para ver
                cómo cambia el diseño de la página.
            </p>
        </section>
    </div>
</body>
</html>
