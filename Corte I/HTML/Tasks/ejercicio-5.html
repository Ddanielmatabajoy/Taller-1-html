<!DOCTYPE html>

<head>

<body>
     <h1>Horario académico</h1>
 
        <table>
            <thead>
                <tr>
                    <th>Día</th>
                    <th>Materia</th>
                    <th>Horario</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Lunes</td>
                    <td>Programación en Ambiente Web I</td>
                    <td rowspan="2">4:30 pm - 6:00 pm</td>
                </tr>
                <tr>
                    <td>Martes</td>
                    <td>Programación en Ambiente Web I</td>
                    <td rowspan="2">7:20 am - 9:00 am</td>
                </tr>
                <tr>
                    <td>Miércoles</td>
                    <td>Bases de Datos</td>
                    <td>9:00 am - 11:00 am</td>
                </tr>
                <tr>
                    <td>Jueves</td>
                    <td>Estructuras de Datos</td>
                    <td>2:00 pm - 4:00 pm</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="2">Total de materias</td>
                    <td>3</td>
                </tr>
            </tfoot>
        </table>
